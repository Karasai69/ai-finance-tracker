# Запуск вместе с PostgreSQL: docker compose up --build
# Ключи ИИ берутся из файла .env рядом с этим файлом.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://finance:finance@db:5432/finance
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
