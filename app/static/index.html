<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6b4f">
  <title>Финансы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <span class="brand">Финансы</span>
      <nav class="month" aria-label="Выбор месяца" hidden>
        <button type="button" id="prev-month" class="month-arrow" aria-label="Предыдущий месяц">‹</button>
        <span id="month-label" class="month-label"></span>
        <button type="button" id="next-month" class="month-arrow" aria-label="Следующий месяц">›</button>
      </nav>
      <div class="account" id="account" hidden>
        <span id="user-email" class="user-email"></span>
        <button type="button" id="logout" class="logout">Выйти</button>
      </div>
    </div>
  </header>

  <section id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card" novalidate>
      <h1 id="auth-title">Вход</h1>
      <p class="auth-lead">Записывайте расходы обычным текстом — таблица соберётся сама.</p>
      <label for="auth-email">Email</label>
      <input id="auth-email" type="email" autocomplete="email" placeholder="name@gmail.com" required>
      <label for="auth-password">Пароль</label>
      <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required>
      <p id="auth-hint" class="auth-hint" hidden>Не меньше 8 символов</p>
      <p id="auth-error" class="auth-error" role="alert"></p>
      <button type="submit" id="auth-submit" class="btn primary wide">Войти</button>
      <p class="auth-switch">
        <span id="auth-switch-text">Нет аккаунта?</span>
        <button type="button" id="auth-switch" class="link-btn">Зарегистрироваться</button>
      </p>
    </form>
  </section>

  <main id="app" hidden>
    <section class="summary" aria-label="Итоги месяца">
      <div class="balance">
        <span class="balance-label">Остаток за месяц</span>
        <strong id="sum-balance" class="balance-value">0 ₸</strong>
      </div>
      <dl class="totals">
        <div><dt>Доходы</dt><dd id="sum-income" class="income">0 ₸</dd></div>
        <div><dt>Расходы</dt><dd id="sum-expense" class="expense">0 ₸</dd></div>
        <div><dt>Дал в долг</dt><dd id="sum-lent" class="lend">0 ₸</dd></div>
      </dl>
    </section>

    <section class="entry" aria-label="Новая запись">
      <label for="text" class="entry-label">Что потратили или получили?</label>
      <textarea id="text" rows="2"
        placeholder="такси 300, овощи 896, брат прислал 10000, дал Султану в долг 5000"></textarea>
      <div class="entry-actions">
        <input type="date" id="date" aria-label="Дата">
        <button type="button" id="voice" class="btn ghost" hidden>Голосом</button>
        <button type="button" id="parse" class="btn primary">Разобрать</button>
      </div>
      <p id="status" class="status" role="status"></p>
      <p id="ai-note" class="ai-note"></p>

      <div id="preview" class="preview" hidden>
        <p class="preview-head">Проверьте записи перед сохранением <span id="source" class="source"></span></p>
        <div id="preview-items"></div>
        <div class="entry-actions end">
          <button type="button" id="cancel" class="btn ghost">Отмена</button>
          <button type="button" id="save" class="btn primary">Сохранить</button>
        </div>
      </div>
    </section>

    <section class="ledger" aria-label="Записи">
      <div class="ledger-bar">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-table" class="tab" aria-selected="true">Таблица</button>
          <button type="button" role="tab" id="tab-list" class="tab" aria-selected="false">Список</button>
        </div>
        <div class="ledger-actions">
          <button type="button" id="import" class="export link-btn">Загрузить CSV</button>
          <input type="file" id="import-file" accept=".csv,text/csv" hidden>
          <a id="export" class="export" href="/api/export.csv">Скачать CSV</a>
        </div>
      </div>
      <div id="view-table" class="table-wrap" tabindex="0" aria-label="Таблица расходов по дням"></div>
      <div id="view-list" class="list" hidden></div>
    </section>

    <section class="categories" aria-label="Расходы по категориям">
      <h2>Куда ушли деньги</h2>
      <div id="categories" class="bars"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
